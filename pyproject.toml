[project]
name = "short-horizon-reversion"
version = "1.0.0"
description = "Replication package: short-horizon mean reversion in cryptocurrency markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
fetch = ["alpaca-py>=0.30"]

[tool.uv]
package = false
